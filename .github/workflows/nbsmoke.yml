name: Smoke-test the GPU training notebook (CPU, tiny)
on:
  workflow_dispatch: {}
  push:
    paths: ['train/rubout_train_gpu.ipynb', '.github/workflows/nbsmoke.yml', 'ci/nb_smoke.py']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update -qq; sudo apt-get install -y -qq fontconfig fonts-dejavu fonts-liberation fonts-freefont-ttf fonts-roboto fonts-open-sans fonts-lato fonts-hack fonts-inconsolata || true
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q onnx onnxruntime scikit-image scikit-learn pillow
          python ci/train/prep_people.py 2>&1 | tail -3
      - name: Run notebook code
        continue-on-error: true
        run: |
          python ci/nb_smoke.py
          ln -sfn $GITHUB_WORKSPACE $GITHUB_WORKSPACE/rubout
          cd $GITHUB_WORKSPACE && python /tmp/nb_run.py 2>&1 | tail -60 | tee /tmp/nbsmoke.log
          ls -la detector.* | tee -a /tmp/nbsmoke.log
      - name: Commit log
        if: always()
        run: |
          mkdir -p report; cp /tmp/nbsmoke.log report/nbsmoke.log || echo "no log" > report/nbsmoke.log
          cp detector.onnx report/smoke_detector.onnx 2>/dev/null || true
          cp detector.json report/smoke_detector.json 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add report; git commit -m "ci: notebook smoke test [skip ci]" || echo nothing
          git pull --rebase origin main || true; git push origin HEAD:main
